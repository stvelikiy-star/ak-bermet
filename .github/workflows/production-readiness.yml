name: Production Readiness

on:
  push:
    branches: [main, integration/ak-bermet-3day]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      GOOGLE_SHEETS_ENABLED: "false"
      AI_PROVIDER: mock
      AI_ENABLE_REAL_CALLS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit --incremental false

      - name: Room master tests
        run: npm run test:room-master

      - name: Pricing V6 tests
        run: npm run test:pricing-v6

      - name: Canonical legal and public FAQ contract
        run: npm run test:legal-contract

      - name: Real AI provider fail-closed contract
        run: npm run test:ai-provider-mode

      - name: Supabase availability authority contract
        run: npm run test:availability-authority

      - name: Lead durability contract
        run: npm run test:lead-durability

      - name: Lead Sheets outbox contract
        run: npm run test:leads-sheets-outbox

      - name: Public room catalog contract
        run: npm run test:room-public-catalog

      - name: Production backup contract
        run: npm run test:backup-contract

      - name: Supabase SECURITY DEFINER privilege contract
        run: npm run test:supabase-security-contract

      - name: Manual booking transaction contract
        run: npm run test:manual-booking

      - name: Manual payment ledger contract
        run: npm run test:manual-payments

      - name: Booking chessboard rules
        run: npm run test:booking-chessboard

      - name: Super chessboard V2 contract
        run: npm run test:super-chessboard

      - name: Manager live-data contract
        run: npm run test:manager-live-data

      - name: Staff Auth provisioner contract
        run: npm run test:staff-auth-provisioner

      - name: Staff real-session UAT offline contract
        run: node --experimental-strip-types --test src/lib/staff-real-session-uat.contract.test.mjs

      - name: Sheets mirror outbox contract
        run: npm run test:sheets-sync-outbox

      - name: Sheets mirror worker contract
        run: npm run test:sheets-sync-worker

      - name: Production preflight contract
        run: npm run test:production-preflight

      - name: Local staff-auth preflight contract
        run: npm run test:local-auth-preflight

      - name: Housekeeping tests
        run: npm run test:housekeeping

      - name: Technician tests
        run: npm run test:technician

      - name: Inspection tests
        run: npm run test:inspection

      - name: Production build
        run: npm run build

      - name: Repository generated-file hygiene
        run: |
          test -z "$(git ls-files '*.tsbuildinfo')"
          git diff --exit-code

      - name: Build production container
        run: docker build --tag ak-bermet:${{ github.sha }} .
