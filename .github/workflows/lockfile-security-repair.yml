name: Lockfile Security Repair

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lockfile-security-repair.yml"

permissions:
  contents: write

concurrency:
  group: ak-bermet-lockfile-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Regenerate lockfile from root security overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Verify manifest was not rewritten
        run: git diff --exit-code -- package.json

      - name: Verify full dependency audit
        run: npm audit --audit-level=high

      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "LOCKFILE_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh lockfile for patched transitive dependencies"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
