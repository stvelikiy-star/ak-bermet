name: Sharp Lock Refresh

on:
  push:
    branches:
      - security/sharp-0.35.4-2026-09-09
    paths:
      - package.json
      - .github/workflows/sharp-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/sharp-0.35.4-2026-09-09
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Refresh lockfile with npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify install
        run: npm ci
      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify full audit
        run: npm audit --audit-level=high
      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- package.json; then
            echo "package.json changed unexpectedly"
            git diff -- package.json
            exit 1
          fi
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json unchanged"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for sharp 0.35.4"
          git push origin HEAD:security/sharp-0.35.4-2026-09-09
