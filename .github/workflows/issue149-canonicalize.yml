name: One-shot issue 149 canonicalization

on:
  push:
    branches:
      - fix/issue-149-cancellation-source-of-truth

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact scoped patch
        run: python3 .github/issue149_patch.py

      - name: Verify cancellation contract
        run: |
          set -euo pipefail
          node --test src/data/legal.contract.test.mjs
          git diff --check

      - name: Commit exact final scope
        run: |
          set -euo pipefail
          rm .github/issue149_patch.py
          rm .github/workflows/issue149-canonicalize.yml
          git config user.name "ai-prof-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only origin/main | sort)"
          expected="$(printf '%s\n' \
            src/app/manager/settings/page.tsx \
            src/data/legal.contract.test.mjs \
            src/data/legal.ts \
            src/lib/ai/knowledge-base.ts \
            | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected final scope versus origin/main:'
            printf '%s\n' "$changed"
            exit 1
          fi
          git commit -m "fix(legal): unify cancellation rules source of truth"
          git push origin HEAD:fix/issue-149-cancellation-source-of-truth
