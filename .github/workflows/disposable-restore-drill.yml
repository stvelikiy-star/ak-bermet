name: Disposable Restore Drill

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/disposable-restore-drill.yml"
      - "scripts/restore-drill-workflow.contract.test.mjs"
      - "supabase/migrations/**"
      - "scripts/production-migrations-approved.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ak-bermet-disposable-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore workflow safety contract
        run: node --test scripts/restore-drill-workflow.contract.test.mjs

      - name: Start disposable local Supabase
        run: npx supabase start

      - name: Apply repository migrations from zero
        run: npx supabase db reset --local --no-seed

      - name: Backup and restore into a second disposable database
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$DB_CONTAINER"

          APPROVED_COUNT="$(node -e "const x=require('./scripts/production-migrations-approved.json'); process.stdout.write(String(x.migrations.length))")"
          SOURCE_COUNT="$(docker exec "$DB_CONTAINER" psql -U postgres -d postgres -Atc 'select count(*) from supabase_migrations.schema_migrations')"
          test "$SOURCE_COUNT" = "$APPROVED_COUNT"

          docker exec "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create table public.restore_drill_marker (
            id integer primary key,
            marker text not null
          );
          insert into public.restore_drill_marker(id, marker)
          values (1, 'AK_BERMET_RESTORE_DRILL_2026');
          SQL

          docker exec "$DB_CONTAINER" pg_dump \
            -U postgres \
            -d postgres \
            --format=custom \
            --no-owner \
            --no-acl \
            --file=/tmp/ak-bermet-restore-drill.dump

          docker exec "$DB_CONTAINER" dropdb -U postgres --if-exists akbermet_restore_drill
          docker exec "$DB_CONTAINER" createdb -U postgres akbermet_restore_drill
          docker exec "$DB_CONTAINER" pg_restore \
            -U postgres \
            -d akbermet_restore_drill \
            --no-owner \
            --no-acl \
            --exit-on-error \
            /tmp/ak-bermet-restore-drill.dump

          RESTORED_COUNT="$(docker exec "$DB_CONTAINER" psql -U postgres -d akbermet_restore_drill -Atc 'select count(*) from supabase_migrations.schema_migrations')"
          MARKER_COUNT="$(docker exec "$DB_CONTAINER" psql -U postgres -d akbermet_restore_drill -Atc "select count(*) from public.restore_drill_marker where id=1 and marker='AK_BERMET_RESTORE_DRILL_2026'")"
          ROOM_TABLE="$(docker exec "$DB_CONTAINER" psql -U postgres -d akbermet_restore_drill -Atc "select to_regclass('public.room_units') is not null")"
          PAYMENT_TABLE="$(docker exec "$DB_CONTAINER" psql -U postgres -d akbermet_restore_drill -Atc "select to_regclass('public.booking_payments') is not null")"
          CMS_TABLE="$(docker exec "$DB_CONTAINER" psql -U postgres -d akbermet_restore_drill -Atc "select to_regclass('public.site_content') is not null")"
          HOLD_RPC="$(docker exec "$DB_CONTAINER" psql -U postgres -d akbermet_restore_drill -Atc "select to_regprocedure('public.fn_create_availability_hold(uuid,date,date,uuid,uuid,text)') is not null")"

          test "$RESTORED_COUNT" = "$SOURCE_COUNT"
          test "$MARKER_COUNT" = "1"
          test "$ROOM_TABLE" = "t"
          test "$PAYMENT_TABLE" = "t"
          test "$CMS_TABLE" = "t"
          test "$HOLD_RPC" = "t"

          echo "RESTORE_DRILL_PASS migrations=$RESTORED_COUNT marker=$MARKER_COUNT"

          docker exec "$DB_CONTAINER" dropdb -U postgres akbermet_restore_drill

      - name: Stop disposable local Supabase
        if: always()
        run: npx supabase stop --no-backup
