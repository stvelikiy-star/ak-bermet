name: Deploy AK BERMET to Vercel

on:
  workflow_dispatch:

concurrency:
  group: ak-bermet-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_7GagNlblg6wDAIOoF44H7dFN
      VERCEL_PROJECT_ID: prj_b3kaGYbW8gVtJg4o5PlP6K4kxaIV
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify lint
        run: npm run lint

      - name: Verify production build
        run: npm run build

      - name: Pull Vercel production settings
        run: npx vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID"

      - name: Deploy prebuilt output
        run: npx vercel deploy --prebuilt --prod --yes --scope "$VERCEL_ORG_ID"
